[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-bridge"
version = "0.2.0"
description = "微信官方 iLink / Clawbot Bot 桥接：文本/图片/语音/视频/文件双向收发"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "qrcode",
    "pycryptodome",
]

[project.scripts]
wechat-bridge = "wechat_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["wechat_bridge*"]
